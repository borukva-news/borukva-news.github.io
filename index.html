  <title>Borukva News</title>

  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages

    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>

<body>
  <div id="root"></div>
<script>
  (function () {
    var redirectKey = 'github-pages-redirect';
    var redirectPath = sessionStorage.getItem(redirectKey);

    if (redirectPath) {
      sessionStorage.removeItem(redirectKey);

      // Якщо шлях існує — відновлюємо його.
      // Якщо React Router не знає такого шляху,
      // його path="*" відкриє NewsHomePage.
      if (redirectPath !== '/') {
        window.history.replaceState(
          null,
          '',
          redirectPath
        );
      }
    }
  })();
</script>
