<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borukva News</title>

  <script>
    (function () {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Якщо це вже головна — нічого не робимо.
      if (path === '/') {
        return;
      }

      // Захист від нескінченного циклу.
      var redirectKey = 'github-pages-redirect';

      if (sessionStorage.getItem(redirectKey) === path + search + hash) {
        sessionStorage.removeItem(redirectKey);
        window.location.replace('/');
        return;
      }

      // Запам'ятовуємо URL, щоб index.html міг його відновити.
      sessionStorage.setItem(
        redirectKey,
        path + search + hash
      );

      // Переходимо на головну.
      window.location.replace('/');
    })();
  </script>
</head>

<body>
  <noscript>
    <p>Будь ласка, увімкніть JavaScript.</p>
  </noscript>
</body>

</html>
